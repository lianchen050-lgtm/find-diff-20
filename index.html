<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>找不同大挑戰 · 20 處</title>
<style>
:root{--bg:#f6f1ea;--cd:#fff;--tx:#3d3a35;--sb:#8a8378;--ac:#e07a5f;--ok:#3d9970;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b19;--cd:#2a2825;--tx:#ece7df;--sb:#a39b8e}}
:root[data-theme="dark"]{--bg:#1c1b19;--cd:#2a2825;--tx:#ece7df;--sb:#a39b8e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",Roboto,Arial,sans-serif}
body{margin:0;background:var(--bg);color:var(--tx);padding:12px;min-height:100vh}
.w{max-width:860px;margin:0 auto}
h1{font-size:20px;margin:6px 0 4px;text-align:center}
.sub{font-size:13px;color:var(--sb);text-align:center;margin-bottom:10px}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.pill{background:var(--cd);border-radius:20px;padding:6px 14px;box-shadow:0 1px 4px rgba(0,0,0,.1);font-weight:bold}
button{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:7px 16px;font-weight:bold;font-size:14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.g{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.g{grid-template-columns:1fr 1fr}}
.pn{background:var(--cd);border-radius:12px;padding:6px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.pn small{display:block;text-align:center;color:var(--sb);font-size:12px;margin:2px 0 4px}
svg{width:100%;height:auto;display:block;border-radius:8px;cursor:crosshair;touch-action:manipulation}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);align-items:center;justify-content:center;padding:20px;z-index:9}
#ov div{background:var(--cd);border-radius:16px;padding:22px;max-width:320px;text-align:center;line-height:1.7}
</style></head><body><div class="w">
<h1>🔍 找不同大挑戰</h1>
<div class="sub">兩張房間圖有 <b>20 處</b>不同。點任一張圖找出差異,點錯會加 5 秒!</div>
<div class="bar"><span class="pill">✅ <span id="f">0</span>/20</span><span class="pill">⏱ <span id="tm">0:00</span></span><span class="pill">❌ <span id="ms">0</span></span><button id="hb" onclick="hint()">💡 提示 (3)</button><button onclick="start()">🔄 重來</button></div>
<div class="g"><div class="pn"><small>圖 A</small><svg id="a" viewBox="0 0 400 300"></svg></div><div class="pn"><small>圖 B</small><svg id="b" viewBox="0 0 400 300"></svg></div></div>
</div>
<div id="ov"><div><div id="ot" style="font-size:18px;font-weight:bold"></div><p id="od"></p><button onclick="start()">再玩一次</button></div></div>
<script>
const $=i=>document.getElementById(i);
const DF=[[95,45],[95,70],[173,50],[227,53],[278,56],[272,33],[330,125],[354,115],[370,168],[100,198],[48,172],[120,184],[200,158],[239,150],[265,165],[230,262],[185,242],[90,270],[379,238],[147,210],[20,60]];
const D=DF.filter((_,i)=>i!==1);
let found,mis,sec,tim,hints,over;
function sc(b){
 let s='<rect width="400" height="300" fill="#f3e9dc"/><rect y="225" width="400" height="75" fill="#cfae85"/>';
 s+='<rect x="20" y="25" width="100" height="90" fill="#bfe3ff" stroke="#8a6d4b" stroke-width="4"/><ellipse cx="45" cy="48" rx="14" ry="7" fill="#fff"/>';
 if(!b)s+='<ellipse cx="95" cy="45" rx="12" ry="6" fill="#fff"/>';
 s+='<line x1="70" y1="25" x2="70" y2="115" stroke="#8a6d4b" stroke-width="3"/>';
 s+='<line x1="20" y1="70" x2="120" y2="70" stroke="#8a6d4b" stroke-width="3"/>';
 s+='<rect x="12" y="20" width="16" height="100" fill="'+(b?'#e5a38f':'#e58fa3')+'"/>';
 s+='<rect x="150" y="30" width="46" height="38" fill="#fff" stroke="#8a6d4b" stroke-width="3"/><text x="173" y="57" font-size="22" text-anchor="middle" fill="#d33">'+(b?'★':'♥')+'</text>';
 s+='<g transform="'+(b?'rotate(6 227 53)':'')+'"><rect x="210" y="40" width="34" height="26" fill="#cfe8d5" stroke="#8a6d4b" stroke-width="3"/></g>';
 s+='<circle cx="272" cy="50" r="20" fill="#fff" stroke="#555" stroke-width="3"/><line x1="272" y1="50" x2="272" y2="39" stroke="#333" stroke-width="3"/><line x1="272" y1="50" x2="'+(b?280:286)+'" y2="'+(b?64:50)+'" stroke="#333" stroke-width="2"/>';
 s+=(b?'':'<circle cx="272" cy="33" r="2" fill="#333"/>')+'<circle cx="289" cy="50" r="2" fill="#333"/><circle cx="272" cy="67" r="2" fill="#333"/><circle cx="255" cy="50" r="2" fill="#333"/>';
 s+='<rect x="300" y="100" width="90" height="125" fill="#b98a5e"/><line x1="300" y1="140" x2="390" y2="140" stroke="#7a5c3b" stroke-width="3"/><line x1="300" y1="180" x2="390" y2="180" stroke="#7a5c3b" stroke-width="3"/>';
 const c=['#e55','#58c','#6b6','#eb4','#a6c'];
 c.forEach((k,i)=>{const h=i==3?(b?22:30):30;s+='<rect x="'+(306+i*14)+'" y="'+(140-h)+'" width="12" height="'+h+'" fill="'+(i==1&&b?'#85c':k)+'"/>'});
 c.slice().reverse().forEach((k,i)=>s+='<rect x="'+(306+i*12)+'" y="152" width="10" height="28" fill="'+k+'"/>');
 if(b)s+='<rect x="362" y="164" width="16" height="16" fill="#c8643c"/><circle cx="370" cy="160" r="8" fill="#4a9"/>';
 s+='<rect x="20" y="170" width="140" height="55" fill="#8ecae6"/><rect x="15" y="150" width="10" height="75" fill="#7a5c3b"/>';
 [185,198,211].forEach((y,i)=>{if(!(b&&i==1))s+='<line x1="40" y1="'+y+'" x2="158" y2="'+y+'" stroke="#fff" stroke-width="3"/>'});
 s+='<ellipse cx="'+(b?52:45)+'" cy="172" rx="16" ry="8" fill="#fff"/><circle cx="120" cy="172" r="10" fill="#c68a5b"/><circle cx="115" cy="166" r="3" fill="#c68a5b"/><circle cx="125" cy="166" r="3" fill="#c68a5b"/>';
 if(!b)s+='<polygon points="114,182 126,182 120,187" fill="#d33"/>';
 s+='<rect x="180" y="175" width="100" height="8" fill="#8a6d4b"/><rect x="185" y="183" width="6" height="42" fill="#8a6d4b"/><rect x="269" y="183" width="6" height="42" fill="#8a6d4b"/>';
 s+='<rect x="196" y="165" width="8" height="10" fill="#555"/><polygon points="190,165 210,165 205,150 195,150" fill="'+(b?'#f48442':'#f4c542')+'"/>';
 s+='<rect x="232" y="160" width="14" height="15" fill="#fff" stroke="#555" stroke-width="2"/>'+(b?'':'<path d="M239 158 q-4 -6 0 -12" stroke="#aaa" stroke-width="2" fill="none"/>');
 s+='<rect x="250" y="168" width="26" height="7" fill="#6aa"/>'+(b?'':'<line x1="255" y1="165" x2="275" y2="165" stroke="#e5c100" stroke-width="3"/>');
 s+='<ellipse cx="210" cy="262" rx="90" ry="22" fill="#d9a0b8"/>';
 [160,190,230,260].forEach((x,i)=>{if(!(b&&i==2))s+='<circle cx="'+x+'" cy="262" r="4" fill="#fff"/>'});
 s+='<ellipse cx="215" cy="248" rx="22" ry="12" fill="#888"/><circle cx="238" cy="240" r="9" fill="#888"/><polygon points="232,234 235,226 238,234" fill="#888"/><polygon points="239,234 243,227 245,236" fill="#888"/>';
 s+='<path d="M193 248 q-14 '+(b?4:-4)+' -12 '+(b?12:-16)+'" stroke="#888" stroke-width="5" fill="none"/>';
 s+='<ellipse cx="60" cy="268" rx="12" ry="6" fill="#345"/>'+(b?'':'<ellipse cx="90" cy="270" rx="12" ry="6" fill="#345"/>');
 s+='<polygon points="355,250 380,250 377,285 358,285" fill="#c8643c"/>';
 [[355,238],[367,226],[379,238],[367,244]].forEach((p,i)=>{if(!(b&&i==2))s+='<ellipse cx="'+p[0]+'" cy="'+p[1]+'" rx="8" ry="5" fill="#4a9a5a"/>'});
 s+='<rect x="140" y="200" width="14" height="18" fill="#fff" stroke="#999"/><circle cx="145" cy="206" r="1.5" fill="#333"/><circle cx="149" cy="206" r="1.5" fill="#333"/>'+(b?'<circle cx="147" cy="212" r="1.5" fill="#333"/>':'');
 return s}
function pt(e,svg){const r=svg.getBoundingClientRect();return[(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*300/r.height]}
function mark(i){['a','b'].forEach(k=>$(k).insertAdjacentHTML('beforeend','<circle cx="'+D[i][0]+'" cy="'+D[i][1]+'" r="15" fill="none" stroke="#3d9970" stroke-width="3"/>'))}
function click(e){if(over)return;const[x,y]=pt(e,e.currentTarget);let h=-1;
 D.forEach((d,i)=>{if(!found.has(i)&&Math.hypot(d[0]-x,d[1]-y)<=16)h=i});
 if(h>=0){found.add(h);mark(h);$('f').textContent=found.size;if(found.size==20)win()}
 else{mis++;sec+=5;$('ms').textContent=mis;e.currentTarget.insertAdjacentHTML('beforeend','<text x="'+x+'" y="'+(y+6)+'" font-size="20" text-anchor="middle" fill="#d33" class="x">✗</text>');setTimeout(()=>e.currentTarget.querySelectorAll('.x').forEach(n=>n.remove()),500)}}
function hint(){if(over||hints<=0)return;const i=D.findIndex((_,k)=>!found.has(k));hints--;sec+=10;$('hb').textContent='💡 提示 ('+hints+')';if(!hints)$('hb').disabled=true;
 ['a','b'].forEach(k=>$(k).insertAdjacentHTML('beforeend','<circle class="hh" cx="'+D[i][0]+'" cy="'+D[i][1]+'" r="26" fill="none" stroke="#e07a5f" stroke-width="3" stroke-dasharray="5 4"/>'));
 setTimeout(()=>document.querySelectorAll('.hh').forEach(n=>n.remove()),2200)}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function win(){over=true;clearInterval(tim);$('ot').textContent='🎉 全部找到了!';$('od').innerHTML='用時 '+fmt(sec)+'(含扣時)<br>點錯 '+mis+' 次<br>'+(sec<240?'你的眼力太強了!':sec<420?'很厲害!':'完成就是勝利!');$('ov').style.display='flex'}
function start(){found=new Set();mis=0;sec=0;hints=3;over=false;clearInterval(tim);$('ov').style.display='none';
 $('a').innerHTML=sc(0);$('b').innerHTML=sc(1);$('f').textContent=0;$('ms').textContent=0;$('tm').textContent='0:00';$('hb').disabled=false;$('hb').textContent='💡 提示 (3)';
 tim=setInterval(()=>{sec++;$('tm').textContent=fmt(sec)},1000)}
$('a').addEventListener('click',click);$('b').addEventListener('click',click);start();
</script></body></html>
